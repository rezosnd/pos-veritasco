version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pos_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-securepassword}
      MONGO_INITDB_DATABASE: restaurant_pos
    volumes:
      - mongodb_data:/data/db
    networks:
      - pos_network

  redis:
    image: redis:7.2-alpine
    container_name: pos_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pos_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:securepassword@mongodb:27017/restaurant_pos?authSource=admin
      REDIS_URL: redis://:redispassword@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_minimum_64_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_refresh_secret_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      - mongodb
      - redis
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - pos_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5000}
    depends_on:
      - backend
    networks:
      - pos_network

volumes:
  mongodb_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  pos_network:
    driver: bridge
